[project]
name = "megabrain"
version = "0.5.0"
description = "Construção incremental de um LLM do zero (RASCHKA, Build a Large Language Model From Scratch) — Projeto Integrador UNOESC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "tiktoken>=0.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
# Notebooks e execução deles pela linha de comando (nbconvert).
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.uv]
# O projeto é um conjunto de scripts, não um pacote instalável.
package = false

# PyTorch com CUDA 12.6 no Windows e no Linux; no macOS vem do PyPI (CPU/MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
